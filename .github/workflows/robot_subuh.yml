name: Robot Scraper Subuh

# KAPAN ROBOT INI HARUS BANGUN?
on:
 schedule:
    # SESI PAGI (Target Tiba: ~08:00 Pagi WIB)
    # Dimajukan ke jam 20:27 UTC (03:27 Dini Hari WIB) 
    # Mengantisipasi antrean server malam/pagi yang sering delay 3-4 jam
    - cron: '27 20 * * 0-4' 
    
    # SESI SORE (Target Tiba: Sebelum 18:00 WIB untuk Persiapan Pasar US)
    # Dimajukan ke jam 05:17 UTC (12:17 Siang WIB)
    # Mengantisipasi jam sibuk server sore hari agar tidak telat sampai malam
    - cron: '17 5 * * 1-5'
    
  # Fitur tambahan untuk mempermudah tes jalankan manual dari tab Actions
  workflow_dispatch:

# APA YANG HARUS DILAKUKAN ROBOT?
jobs:
  sedot_data_harian:
    runs-on: ubuntu-latest
    permissions:
      contents: write 
    
    steps:
    - name: 1. Buka Pintu Gudang (Checkout)
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0

    - name: 2. Siapkan Mesin Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 3. Pasang Onderdil (Install Library)
      run: pip install --upgrade yfinance pandas pytz requests urllib3 ipython jinja2 pandas-datareader
      
    - name: 4. Tekan Tombol RUN Mesin Scraper & Analisis!
      env:
        TGRAM_COUNTER: ${{ secrets.TGRAM_COUNTER }}
        TGRAM_TAG: ${{ secrets.TGRAM_TAG }}
      run: |
        python scraper_mesin.py
        python analisis_auto.py

    - name: 5. Simpan Hasil CSV Kembali ke Gudang
      run: |
        git config --global user.name "Robot Scraper"
        git config --global user.email "robot@github.com"
        
        # 1. Tandai file CSV yang berubah
        git add pressure_6mo_history.csv
        
        # 2. Cek apakah ada perubahan data
        if git diff --cached --quiet; then
          echo "Tidak ada perubahan data untuk di-commit."
          exit 0
        fi
        
        # 3. Commit perubahan lokal terlebih dahulu
        git commit -m "Update data harian otomatis jam 5 Pagi"
        
        # 4. Tarik update remote dan push
        git pull --rebase origin main
        git push origin HEAD:main
