name: Robot Scraper Subuh

# KAPAN ROBOT INI HARUS BANGUN?
on:
  schedule:
    # SESI PAGI (Target Tiba: ~08:00 Pagi WIB)
    - cron: '27 20 * * 0-4'  
    
    # SESI SORE (Target Tiba: Sebelum 18:00 WIB untuk Persiapan Pasar US)
    - cron: '17 5 * * 1-5'
    
  # Fitur tambahan untuk mempermudah tes jalankan manual dari tab Actions
  workflow_dispatch:

# APA YANG HARUS DILAKUKAN ROBOT?
jobs:
  sedot_data_harian:
    runs-on: ubuntu-latest
    permissions:
      contents: write 
    
    steps:
    - name: 1. Buka Pintu Gudang (Checkout)
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0

    - name: 2. Siapkan Mesin Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 3. Pasang Onderdil (Install Library Termasuk tvDatafeed)
      run: pip install --upgrade pandas pytz requests urllib3 ipython jinja2 pandas-datareader tvDatafeed
      
    - name: 4. Tekan Tombol RUN Mesin Scraper & Analisis!
      env:
        # Memuat Secret TradingView
        TDV_TAG: ${{ secrets.TDV_TAG }}
        TDV_COUNTER: ${{ secrets.TDV_COUNTER }}
        # Memuat Secret Telegram
        TGRAM_TAG: ${{ secrets.TGRAM_TAG }}
        TGRAM_COUNTER: ${{ secrets.TGRAM_COUNTER }}
      run: |
        python scraper_mesin.py
        python analisis_auto.py

    - name: 5. Simpan Hasil CSV Kembali ke Gudang
      run: |
        git config --global user.name "Robot Scraper"
        git config --global user.email "robot@github.com"
        
        # 1. Ambil dan sinkronkan dengan update terbaru dari GitHub terlebih dahulu
        git fetch origin main
        git rebase origin/main || git rebase --abort
        
        # 2. Masukkan file CSV hasil scraping terbaru ke staging area
        git add pressure_6mo_history.csv
        
        # 3. Cek apakah ada perubahan data aktual
        if git diff --cached --quiet; then
          echo "Tidak ada perubahan data baru untuk di-commit."
          exit 0
        fi
        
        # 4. Commit perubahan lokal
        git commit -m "Update data harian otomatis (Anti-Conflict)"
        
        # 5. Push kembali ke cabang main
        git push origin HEAD:main
